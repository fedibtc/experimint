name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `es/fedi9-compat` runs a reduced lane set: the workspace here is the four
# client/common crates only (see `docs/fedi9-compat.md`), so there is no
# `fedimintd-experimint` to link and no integration-test crate to drive. The
# `wasm` lane is the one that matters on this branch — it is the gate the Fedi
# app's mobile build has to pass.
env:
  # Both module families build C from source (secp256k1-sys, ring, aws-lc-sys).
  # A cold build is long; without a cache every job pays it again.
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            cmd: cargo check --workspace --all-targets --locked
          - name: clippy
            cmd: cargo clippy --workspace --all-targets --locked -- -D warnings
          - name: fmt
            cmd: cargo fmt --all --check
          - name: wasm
            # The client-facing crates must stay WASM-safe. Do not add
            # non-WASM-safe dependencies to these four.
            cmd: >-
              cargo check --locked --target wasm32-unknown-unknown
              -p fedimint-amm-common -p fedimint-amm-client
              -p fedimint-usdt-common -p fedimint-usdt-client
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: ${{ matrix.name }}
        run: nix develop --accept-flake-config --command bash -c '${{ matrix.cmd }}'

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      # Unit tests only: the EVM e2e and federation integration suites live in
      # `fedimint-{usdt,amm}-tests`, which are not members of this workspace.
      # `master` is where those run.
      - name: cargo test
        run: nix develop --accept-flake-config --command bash -c 'cargo test --workspace --locked'
