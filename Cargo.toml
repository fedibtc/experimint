# `ol/v0.11.2-fedi5-compat`: the Fedi-consumable workspace. See `docs/fedi9-compat.md`.
#
# This branch exists so the Fedi app can depend on experimint's `usdt` and `amm`
# crates without migrating its own tree to a different fedimint API generation.
# It therefore pins fedimint to Fedi's line (which since v0.11.1-fedi15-usdt
# carries the two hooks the module servers use, `provided_assets` and
# `get_documented_env_vars`, as inert defaults).
#
# `fedimint-usdt-server` is a member so Fedi's own `fedi-fedimintd` can attach
# the module for its devimint e2e tests -- the module compiles UNMODIFIED from
# this branch against the Fedi platform, which is the whole point: the fedimint
# fork used to carry a vendored snapshot of it, and a stale snapshot once
# shipped a silent wire-format break (see the consensus-0.13 bump below).
# Building it here turns that failure mode into a compile error on this branch.
# The bin and integration-test crates stay out — they are built from `master`,
# which is and stays the deployment line.
[workspace]
members = [
    "crypto/threshold-ecdsa",
    "modules/amm/fedimint-amm-client",
    "modules/amm/fedimint-amm-common",
    "modules/usdt/fedimint-usdt-client",
    "modules/usdt/fedimint-usdt-common",
    "modules/usdt/fedimint-usdt-server",
]
# Present on disk, owned by `master`, deliberately out of this workspace.
exclude = [
    "bin/fedimintd-experimint",
    "modules/amm/fedimint-amm-server",
    "modules/amm/fedimint-amm-tests",
    "modules/usdt/fedimint-usdt-tests",
]
resolver = "2"

[workspace.package]
authors = ["The Experimint Developers"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/elsirion/experimint"
version = "0.1.0"

[workspace.dependencies]
# Use the same Fedimint revision as the consuming Fedi workspace.
devimint = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-aead = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-api-client = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-bip39 = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-build = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-client = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-client-module = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-connectors = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-core = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-derive-secret = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-dummy-client = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-dummy-server = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-eventlog = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-lnv2-server = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-logging = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-meta-server = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-mint-client = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-mint-common = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-mint-server = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-mintv2-client = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-mintv2-common = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-mintv2-server = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-server = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-server-core = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-testing = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimint-walletv2-server = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
fedimintd = { git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }
# `hkdf` is what `crypto/threshold-ecdsa` calls the crate; the package is
# fedimint's own `fedimint-hkdf`, so it lives in this pinned block.
hkdf = { package = "fedimint-hkdf", git = "https://github.com/fedibtc/fedimint", rev = "c25967aa1cd4425136c16397317aea6ead9fb0c7" }

# NOTE: fedimint's own `Cargo.lock` is NOT inherited when you depend on it as a
# git dependency — cargo re-resolves the whole tree from scratch. That can land
# on version combinations fedimint itself never builds. Concretely: a fresh
# resolve picks `bdk_electrum 0.23.2`, which pulls `electrum-client 0.24.1`,
# while `fedimint-ldk-node 0.6.1` also depends on `electrum-client 0.23.1`
# directly. Two semver-incompatible copies end up in the graph and
# `fedimint-ldk-node` fails to compile ("`electrum_client::Client: Deref` is not
# satisfied"). Our `Cargo.lock` pins `bdk_electrum` back to 0.23.0, matching
# fedimint's lock. If you ever `cargo update` this back into the ditch:
#
#     cargo update -p bdk_electrum --precise 0.23.0
#
# This only affected `fedimint-amm-tests` (the only crate pulling
# `fedimint-testing` -> gateway -> ldk-node), which is not a member of this
# branch's workspace. Keep `Cargo.lock` committed regardless.

# --- in-repo -----------------------------------------------------------------
# The `*-server` rows name packages this branch excludes from the workspace.
# They are kept so the table stays identical to `master`'s and this branch keeps
# rebasing cleanly; cargo never resolves a `[workspace.dependencies]` entry that
# no member actually depends on.
fedimint-threshold-ecdsa = { path = "crypto/threshold-ecdsa", version = "0.1.0" }
fedimint-amm-client = { path = "modules/amm/fedimint-amm-client", version = "0.1.0" }
fedimint-amm-common = { path = "modules/amm/fedimint-amm-common", version = "0.1.0" }
fedimint-amm-server = { path = "modules/amm/fedimint-amm-server", version = "0.1.0" }
fedimint-usdt-client = { path = "modules/usdt/fedimint-usdt-client", version = "0.1.0" }
fedimint-usdt-common = { path = "modules/usdt/fedimint-usdt-common", version = "0.1.0" }
fedimint-usdt-server = { path = "modules/usdt/fedimint-usdt-server", version = "0.1.0" }

# --- third party -------------------------------------------------------------
# Versions are copied verbatim from the pinned platform branch's
# `[workspace.dependencies]` so we share resolved versions with it rather than
# pulling in a second copy. Do not "upgrade" one of these in isolation — an
# exact match is what keeps `alloy*`/`secp256k1`/`bls12_381`/`cggmp21` from
# unifying into two semver-incompatible copies across the git boundary.
#
# On this branch the platform is `v0.11.2-fedi5-usdt.1`, which pins the `alloy`
# family EXACTLY (`=2.0.4` / `=1.5.7` / `=0.9.5`), so these must match to the
# patch. Carrying master's looser `2.1`/`1.6` here makes the graph unsolvable
# the moment anything on the fedi side also pulls alloy — the fork's
# `fedimint-cli` does, via its own vendored usdt client — because no version
# satisfies both `^1.6` and `=1.5.7`.
#
# Pinning `alloy-sol-types` is NOT sufficient on its own, and the failure is
# confusing: the `sol!` macro comes from `alloy-sol-macro`, which is a
# transitive dep resolved by ordinary semver, so cargo happily pairs a 1.7.x
# macro with 1.5.7 types. The macro then generates calls to ABI methods
# (`abi_decode_returns_with_config` and friends) that do not exist in 1.5.7, and
# the errors point at the `sol!` invocation rather than at the version skew.
# `Cargo.lock` therefore pins all five in lockstep — `alloy-sol-macro`,
# `-macro-expander`, `-macro-input`, `-type-parser` and `-types` at 1.5.7. A
# plain `cargo update` will undo that. To restore:
#
#     for c in alloy-sol-macro alloy-sol-macro-expander alloy-sol-macro-input \
#              alloy-sol-type-parser; do
#         cargo update -p $c --precise 1.5.7
#     done
alloy = { version = "=2.0.4", default-features = false, features = [
    "essentials",
    "reqwest-rustls-tls",
] }
alloy-consensus = "=2.0.4"
alloy-primitives = { version = "=1.5.7", default-features = false, features = [
    "std",
] }
alloy-rlp = "0.3"
alloy-sol-types = { version = "=1.5.7", default-features = false, features = [
    "std",
] }
alloy-trie = "=0.9.5"
anyhow = "1.0.98"
async-stream = "0.3.6"
async-trait = "0.1.88"
bitcoin = { version = "0.32.6", features = ["serde"] }
bitcoin_hashes = "0.14.0"
bincode = "1.3.3"
bls12_381 = "0.8.0"
cggmp21 = { version = "0.6.3", features = [
    "hd-wallet",
    "hd-slip10",
    "curve-secp256k1",
    "state-machine",
] }
clap = { version = "4.5.60", features = ["derive", "env"] }
erased-serde = "0.4"
futures = "0.3.32"
hd-wallet = { version = "0.6.1", default-features = false, features = [
    "slip10",
    "curve-secp256k1",
] }
hex = "0.4.3"
hex_lit = "0.1.1"
rand = "0.8.5"
ring = "0.17.14"
round-based = { version = "0.4", features = ["derive"] }
# No "stream": reqwest 0.12's stream feature pulls wasm-streams 0.4, and any
# consumer that also has a reqwest 0.13 in its graph (alloy, matrix-sdk, iroh 1)
# gets wasm-streams 0.5 too. Both generate the same wasm-bindgen shims, so a
# wasm32 link fails with duplicate symbol: intounderlyingsink_*. Nothing here
# streams a response body -- the usdt client's transport is JSON-RPC.
reqwest = { version = "0.12.28", features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
], default-features = false }
secp256k1 = { version = "0.29.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0.149"
sha2 = "0.10"
sha3 = "0.10.8"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
thiserror = "2.0.18"
tokio = "1.48.0"
tokio-stream = "0.1.18"
tracing = "0.1.44"
url = "2.5.4"

[workspace.lints.clippy]
dbg_macro = "deny"
# Mirrors the platform branch's lint policy, so module source lifted from it
# stays lint-clean here.
literal_string_with_formatting_args = "deny"

[profile.dev]
debug = "line-tables-only"

# Mirrors fedimint: crypto/serialization crates are unusably slow in a debug
# build otherwise.
#
# Shorter than `master`'s list on purpose: cargo warns ("profile package spec
# ... did not match any packages") for every entry absent from the graph, so
# only entries this workspace's graph actually contains appear. The cggmp21
# threshold-ECDSA ecosystem is here because `crypto/threshold-ecdsa` is: its
# Paillier/bignum/curve math is extremely heavy at opt-level 1, which makes
# the MPC signing tests take many minutes in dev.
[profile.dev.package]
bitcoin_hashes = { opt-level = 3 }
bls12_381 = { opt-level = 3 }
cggmp21 = { opt-level = 3 }
cggmp21-keygen = { opt-level = 3 }
fedimint-threshold-crypto = { opt-level = 3 }
ff = { opt-level = 3 }
generic-ec = { opt-level = 3 }
generic-ec-core = { opt-level = 3 }
generic-ec-curves = { opt-level = 3 }
generic-ec-zkp = { opt-level = 3 }
gmp-mpfr-sys = { opt-level = 3 }
group = { opt-level = 3 }
hd-wallet = { opt-level = 3 }
paillier-zk = { opt-level = 3 }
pairing = { opt-level = 3 }
rug = { opt-level = 3 }
rand = { opt-level = 3 }
rand_chacha = { opt-level = 3 }
rand_core = { opt-level = 3 }
ring = { opt-level = 3 }
secp256k1 = { opt-level = 3 }
secp256k1-sys = { opt-level = 3 }
subtle = { opt-level = 3 }
zeroize = { opt-level = 3 }

# `[patch]` is NOT inherited from a git dependency, so the pinned fedimint
# tree's own patch table has to be restated here verbatim. `fedimint-connectors`
# on Fedi's line requires `iroh`'s `no_holepunch` feature, which exists only on
# this fork; without the patch the graph fails to resolve at all
# ("`iroh` does not have that feature"). The rev is the commit
# `v0.35.0-no-holepunch` resolved to in the pinned tree's own `Cargo.lock`.
#
# `[patch]` applies only from the top-level manifest, so this table does nothing
# for anyone depending on these crates: it exists purely so experimint builds
# standalone. A downstream consumer needs its own equivalent — the Fedi app
# already has one, pointing at `fedibtc/iroh` `z/wasm-drop-reqwest-stream`
# rather than this fork, and that one wins there. Only the `no_holepunch`
# feature has to be present; the branch does not have to match.
[patch.crates-io]
iroh = { git = "https://github.com/elsirion/iroh", rev = "0674d2ca472f9c5fbef507ea119cb4d2dd126ae2" }
iroh-base = { git = "https://github.com/elsirion/iroh", rev = "0674d2ca472f9c5fbef507ea119cb4d2dd126ae2" }
iroh-relay = { git = "https://github.com/elsirion/iroh", rev = "0674d2ca472f9c5fbef507ea119cb4d2dd126ae2" }
